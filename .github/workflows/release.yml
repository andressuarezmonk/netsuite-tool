name: Release

on:
  push:
    branches: [master, main]

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # needed so semantic-release can read full git history

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Bump package.json version and tag the release.
      # @semantic-release/npm writes the new version into package.json before
      # the build runs, so the manifest picks up the correct version number.
      - name: Determine and tag release version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # semantic-release succeeds both when it releases and when there is
      # nothing to release (only chore:/refactor:/(ide) commits). When it
      # releases, the new `vX.Y.Z` tag ends up on HEAD (the version bump commit);
      # when it doesn't, HEAD is untagged. Everything below that publishes
      # something depends on this.
      - name: Detect whether a release was just created
        id: release
        run: |
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ -z "$TAG" ]]; then
            echo "No release was created for this push: nothing will be zipped or uploaded."
          else
            echo "Released $TAG"
          fi

      # Build after the version bump so dist/manifest.json reflects the new version.
      # (Runs even without a release, as a check that master still builds.)
      - name: Build
        run: npm run build

      # Never zip/upload without a new release: with no new tag, package.json
      # still holds the PREVIOUS version, and `gh release upload --clobber`
      # would silently replace that published release's zip with a build of
      # newer, unreleased code.
      - name: Zip dist
        if: steps.release.outputs.tag != ''
        run: zip -r dist.zip dist/

      # Upload dist.zip to the release that semantic-release just created.
      - name: Attach assets to release
        if: steps.release.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist.zip --clobber

      # Merge the version bump commit that semantic-release pushed to master
      # back into develop so the two branches stay in sync.
      - name: Sync version bump back to develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git checkout develop
          git merge master --no-edit
          git push origin develop
