name: Release

on:
  push:
    branches: [master, main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed so semantic-release can read full git history

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Bump package.json version and tag the release.
      # @semantic-release/npm writes the new version into package.json before
      # the build runs, so the manifest picks up the correct version number.
      - name: Determine and tag release version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # Build after the version bump so dist/manifest.json reflects the new version.
      - name: Build
        run: npm run build

      - name: Zip dist
        run: zip -r dist.zip dist/

      # Upload dist.zip to the release that semantic-release just created.
      - name: Attach assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          gh release upload "$TAG" dist.zip --clobber

      # Merge the version bump commit that semantic-release pushed to master
      # back into develop so the two branches stay in sync.
      - name: Sync version bump back to develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git checkout develop
          git merge master --no-edit
          git push origin develop
