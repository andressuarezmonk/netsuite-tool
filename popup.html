<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Time Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 360px;
      background: #f5f6fa;
      color: #1a1a2e;
      font-size: 13px;
    }

    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: white;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 { font-size: 14px; font-weight: 700; }
    .header .sub { font-size: 11px; opacity: 0.55; margin-top: 1px; }

    .form { padding: 14px 18px; display: flex; flex-direction: column; gap: 11px; }

    .field { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #777; }

    input, select, textarea {
      padding: 7px 9px;
      border: 1.5px solid #dde1e9;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      background: white;
      color: #1a1a2e;
      width: 100%;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #0066cc; }
    textarea { resize: vertical; min-height: 56px; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .hours-wrap { position: relative; }
    .hours-wrap input { padding-right: 32px; }
    .hours-wrap span { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-size: 11px; color: #aaa; pointer-events: none; }

    .quick-hours { display: flex; gap: 5px; flex-wrap: wrap; }
    .quick-hours button {
      padding: 3px 9px;
      border: 1.5px solid #dde1e9;
      border-radius: 4px;
      background: white;
      font-size: 12px;
      cursor: pointer;
      color: #555;
      transition: all 0.15s;
    }
    .quick-hours button:hover { border-color: #0066cc; color: #0066cc; }
    .quick-hours button.active { border-color: #0066cc; background: #0066cc; color: white; }

    .actions { padding: 0 18px 14px; display: flex; flex-direction: column; gap: 7px; }
    .btn-primary {
      background: #0066cc; color: white; border: none;
      padding: 10px; border-radius: 7px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-primary:hover { background: #0055aa; }
    .btn-primary:disabled { background: #aaa; cursor: not-allowed; }

    .btn-row { display: flex; gap: 7px; }
    .btn-sm {
      flex: 1; background: none; color: #0066cc;
      border: 1.5px solid #0066cc; padding: 7px 10px; border-radius: 6px;
      font-size: 12px; cursor: pointer; transition: all 0.15s;
    }
    .btn-sm:hover { background: #f0f6ff; }

    .status {
      margin: 0 18px 10px;
      padding: 8px 11px; border-radius: 6px; font-size: 12px; font-weight: 500; display: none;
    }
    .status.success { background: #e6f4ea; color: #1e7e34; display: block; }
    .status.error   { background: #fdecea; color: #c0392b; display: block; }
    .status.loading { background: #e8f0fe; color: #1a73e8; display: block; }

    .divider { height: 1px; background: #e8eaf0; margin: 0 18px; }

    .recent-section { padding: 12px 18px 14px; }
    .recent-section h2 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #888; margin-bottom: 7px; }

    .recent-entry {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 9px; background: white;
      border: 1.5px solid #e0e3eb; border-radius: 6px; margin-bottom: 5px;
      cursor: pointer; transition: border-color 0.15s;
    }
    .recent-entry:hover { border-color: #0066cc; }
    .entry-info { font-size: 12px; line-height: 1.4; }
    .entry-hours { font-size: 13px; font-weight: 700; color: #0066cc; flex-shrink: 0; margin-left: 8px; }
    .empty-recent { font-size: 12px; color: #aaa; text-align: center; padding: 6px 0; }
  </style>
</head>
<body>
  <div class="header">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
    </svg>
    <div>
      <h1>Time Tracker</h1>
      <div class="sub">Media.Monks · NetSuite fast entry</div>
    </div>
  </div>

  <form class="form" id="timeForm">
    <div class="row">
      <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date" required />
      </div>
      <div class="field">
        <label for="hours">Hours</label>
        <div class="hours-wrap">
          <input type="number" id="hours" min="0.25" max="24" step="0.25" placeholder="0.0" required />
          <span>h</span>
        </div>
      </div>
    </div>

    <div class="field">
      <label>Quick</label>
      <div class="quick-hours" id="quickHours">
        <button type="button" data-hours="0.5">0.5</button>
        <button type="button" data-hours="1">1</button>
        <button type="button" data-hours="2">2</button>
        <button type="button" data-hours="3">3</button>
        <button type="button" data-hours="4">4</button>
        <button type="button" data-hours="6">6</button>
        <button type="button" data-hours="8">8</button>
      </div>
    </div>

    <div class="field">
      <label for="employee">On behalf of</label>
      <select id="employee">
        <option value="">Loading…</option>
      </select>
    </div>

    <div class="field">
      <label for="project">Project</label>
      <select id="project">
        <option value="">Loading projects…</option>
      </select>
    </div>

    <div class="field">
      <label for="task">Task</label>
      <select id="task">
        <option value="">— No specific task —</option>
      </select>
    </div>

    <div class="field">
      <label for="memo">Notes (optional)</label>
      <textarea id="memo" placeholder="What did you work on?"></textarea>
    </div>
  </form>

  <div id="statusMsg" class="status"></div>

  <div class="actions">
    <button type="submit" form="timeForm" class="btn-primary" id="submitBtn">Log Time</button>
    <div class="btn-row">
      <button type="button" class="btn-sm" id="refreshBtn">↻ Refresh projects</button>
      <button type="button" class="btn-sm" id="openNSBtn">Open NetSuite</button>
    </div>
  </div>

  <div class="divider"></div>

  <div class="recent-section">
    <h2>Recent</h2>
    <div id="recentEntries"><div class="empty-recent">No entries yet</div></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
